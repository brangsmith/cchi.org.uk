name: Build and deploy website

# Every change to main is built and uploaded over SFTP.
# Pull requests only build, so you can check a change before it goes live.
# Run it by hand from the Actions tab to do a dry run (lists what would change, uploads nothing).

on:
  push:
    branches: [main]
    paths-ignore: ["**/README.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list the changes but upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Which version of the site goes live: "cambridge" or "classic" (folders in sites/).
      # Change it without editing this file: Settings > Secrets and variables > Actions > Variables > SITE
      SITE: ${{ vars.SITE || 'cambridge' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: python3 build.py "$SITE"

      - name: Check the build
        run: |
          test -s "dist/$SITE/index.html"
          test -d "dist/$SITE/content"
          ! grep -q "__CHI__" "dist/$SITE/index.html"

      - name: Upload to the web server (SFTP)
        if: github.event_name != 'pull_request'
        env:
          # Secret names start FTP_ for historical reasons; the values are your SFTP details.
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS }}
          REMOTE_DIR: ${{ vars.FTP_DIR }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
          DELETE_REMOVED: ${{ vars.DELETE_REMOVED || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          for v in SFTP_HOST SFTP_USER SFTP_PASSWORD SFTP_KNOWN_HOSTS REMOTE_DIR; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (see README: One-time setup)"; exit 1; }
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          FLAGS="--parallel=3 --verbose --no-perms"
          [ "$DRY_RUN" = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "$DELETE_REMOVED" = "true" ] && FLAGS="$FLAGS --delete"
          # The password goes in through -u (not into the script), so lftp never parses it as a command.
          cat > "$RUNNER_TEMP/deploy.lftp" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          mirror -R $FLAGS "dist/$SITE" "$REMOTE_DIR"
          quit
          LFTP
          sed -i 's/^ *//' "$RUNNER_TEMP/deploy.lftp"
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" -e "source $RUNNER_TEMP/deploy.lftp" "sftp://$SFTP_HOST:$SFTP_PORT"
